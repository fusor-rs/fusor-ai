[package]
name = "paddle-ocr-cli"
description = "The native PaddleOCR-VL host: compile the checkpoint, read images, benchmark, and check parity with the reference goldens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "paddle-ocr"
path = "src/main.rs"
doc = false

[dependencies]
paddle-ocr = { workspace = true, features = ["threads"] }
paddle-ocr-compile.workspace = true
harness.workspace = true
bundle.workspace = true
compile.workspace = true
anyhow.workspace = true
clap.workspace = true

[lints]
workspace = true
