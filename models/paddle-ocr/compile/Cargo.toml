[package]
name = "fusor-ai-paddle-ocr-compile"
description = "Compiles the PaddleOCR-VL-1.6 checkpoint into a bundle: what to keep, renames, q/k/v fusion, the vision MLP padded to whole blocks and the dtype of every tensor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
keywords = ["fusor", "ocr", "safetensors", "quantization", "wasm"]
categories = ["development-tools", "computer-vision"]

[lib]
name = "paddle_ocr_compile"

[dependencies]
paddle-ocr.workspace = true
bundle = { workspace = true, features = ["tokenizer"] }
compile.workspace = true
kernels.workspace = true

[lints]
workspace = true
