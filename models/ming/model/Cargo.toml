[package]
name = "fusor-ai-ming"
description = "Ming-3.0-tts-0.5B: the model (LLM, flow head, aggregator, vocoder), the synthesis loop, prompt and text frontend. No I/O; builds for native and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ming"

[dependencies]
team.workspace = true
kernels.workspace = true
media.workspace = true
blocks.workspace = true
bundle = { workspace = true, features = ["tokenizer"] }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

[features]
# Run the thread team on Rayon's pool (native, and the threaded browser runtimes).
threads = ["team/threads"]

[lints]
workspace = true
