[package]
name = "phonon-cli"
description = "The native Phonon host: compile the checkpoint, synthesize, benchmark, and check parity with the reference goldens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "phonon"
path = "src/main.rs"
doc = false

[dependencies]
phonon = { workspace = true, features = ["threads"] }
phonon-compile.workspace = true
harness.workspace = true
bundle.workspace = true
compile.workspace = true
anyhow.workspace = true
clap.workspace = true

[lints]
workspace = true
