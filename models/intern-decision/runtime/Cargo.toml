[package]
name = "intern-decision-runtime"
description = "The Intern-Decision-2B browser runtime: the model behind a wasm-bindgen surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
intern-decision.workspace = true
runtime.workspace = true
serde_json.workspace = true

[features]
# Threaded runtimes (scripts/build-runtime.sh): the team runs on a wasm-bindgen-rayon pool of
# page-owned workers sharing this module's memory.
threads = ["intern-decision/threads", "runtime/threads"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
