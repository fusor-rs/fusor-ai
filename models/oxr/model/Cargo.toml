[package]
name = "fusor-ai-oxr"
description = "SoMark's OXR-1.0 document parser: image preprocessing, the SigLIP2 NaViT vision encoder, the probabilistic visual vocabulary, the Qwen3 language model, prompts and greedy reading. No I/O; builds for native and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
keywords = ["fusor", "ocr", "vision", "wasm", "inference"]
categories = ["computer-vision", "science", "wasm"]

[lib]
name = "oxr"

[dependencies]
team.workspace = true
kernels.workspace = true
blocks.workspace = true
bundle = { workspace = true, features = ["tokenizer"] }
serde.workspace = true

[features]
# Run the thread team on Rayon's pool (native, and the threaded browser runtimes).
threads = ["team/threads"]

[lints]
workspace = true
