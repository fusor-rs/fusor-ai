[package]
name = "d1-cli"
description = "The native d1 host: compile a d1-2B or d1-Omni-2B checkpoint, decide requests, benchmark, and check parity with the reference goldens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "d1"
path = "src/main.rs"
doc = false

[dependencies]
d1 = { workspace = true, features = ["threads"] }
d1-compile.workspace = true
harness.workspace = true
bundle.workspace = true
compile.workspace = true
media.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
