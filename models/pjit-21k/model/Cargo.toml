[package]
name = "fusor-ai-pjit-21k"
description = "P-JiT 21K text to image: Qwen3.5-4B's hidden states through layer 27, Linum's pixel-space diffusion transformer, Euler steps with adaptive projected guidance, the prompt frontend and a live preview. No I/O; builds for native and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "pjit_21k"

[dependencies]
team.workspace = true
kernels.workspace = true
blocks.workspace = true
media.workspace = true
bundle = { workspace = true, features = ["tokenizer"] }
serde.workspace = true

[features]
# Run the thread team on Rayon's pool (native, and the threaded browser runtimes).
threads = ["team/threads"]

[lints]
workspace = true
