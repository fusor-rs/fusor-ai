[package]
name = "pjit-21k-runtime"
description = "The P-JiT 21K browser runtimes: the text encoder and the image model, each behind a wasm-bindgen surface (bundle parts, a caption and a request in, RGBA pixels out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pjit-21k.workspace = true
runtime.workspace = true
serde_json.workspace = true

[features]
# Threaded runtimes (scripts/build-runtime.sh): the team runs on a wasm-bindgen-rayon pool of
# page-owned workers sharing this module's memory.
threads = ["pjit-21k/threads", "runtime/threads"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
