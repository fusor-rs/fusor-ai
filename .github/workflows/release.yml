name: Release
# Publishing a GitHub release tagged vX.Y.Z runs Check, checks that the tag
# matches the crates' version and publishes the crates to crates.io. Running the
# workflow by hand packages and verifies the crates without publishing. See
# "Releasing" in CONTRIBUTING.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once, and never cancel one halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "fusor-ai-kernels") | .version')
          if [ "$EVENT_NAME" = release ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG must match Cargo.toml version v$version"
            exit 1
          fi

  package:
    needs: [check, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --locked --dry-run

  crates-io:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    # Holds the CARGO_REGISTRY_TOKEN secret. Add required reviewers to this
    # environment to approve each release before it uploads.
    environment: crates-io
    # A first release waits out crates.io's limit on brand-new crates.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Publish unreleased crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # crates.io allows 5 brand-new crates in a burst, then 1 every 10 minutes
        # (https://crates.io/docs/rate-limits), and `cargo publish` refuses to
        # republish a version. So publish in rounds, as fusor's release does: skip
        # what is on crates.io, and wait when crates.io answers 429. A rerun
        # finishes a release that stopped halfway; later releases only update
        # existing crates and finish in one round.
        run: |
          set -o pipefail
          packages=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish != []) | [.name, .version] | @tsv')
          published() {
            local name=$1 version=$2 index="$RUNNER_TEMP/$1-index.json" status
            status=$(curl --silent --show-error --output "$index" --write-out '%{http_code}' \
              "https://index.crates.io/${name:0:2}/${name:2:2}/$name")
            case "$status" in
              200) jq --slurp --exit-status --arg version "$version" 'any(.[]; .vers == $version)' "$index" > /dev/null ;;
              404) return 1 ;;
              *)
                echo "::error::Registry lookup for $name failed with HTTP $status"
                exit 1
                ;;
            esac
          }
          for round in $(seq 1 12); do
            skip=()
            remaining=0
            while IFS=$'\t' read -r name version; do
              if published "$name" "$version"; then
                skip+=(--exclude "$name")
              else
                remaining=$((remaining + 1))
              fi
            done <<< "$packages"
            if [ "$remaining" -eq 0 ]; then
              echo "Every workspace crate version is on crates.io."
              exit 0
            fi
            if cargo publish --workspace --locked "${skip[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
              continue
            fi
            if ! grep -q '429 Too Many Requests' "$RUNNER_TEMP/publish.log"; then
              echo "::error::cargo publish failed for a reason other than crates.io's rate limit"
              exit 1
            fi
            echo "crates.io is limiting new crates; waiting 10 minutes (round $round)."
            sleep 600
          done
          echo "::error::crates.io was still rate-limiting after 12 rounds; rerun this job to finish"
          exit 1
