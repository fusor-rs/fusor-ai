name: Release
# Publishing a GitHub release tagged vX.Y.Z runs Check, checks that the tag
# matches the crates' version and publishes the crates to crates.io. Running the
# workflow by hand packages and verifies the crates without publishing. See
# "Releasing" in CONTRIBUTING.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Never run two releases at once, and never cancel one halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Check that the tag matches the version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "fusor-ai-kernels") | .version')
          if [ "$EVENT_NAME" = release ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag $RELEASE_TAG must match Cargo.toml version v$version"
            exit 1
          fi

  package:
    needs: [check, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --locked --dry-run

  crates-io:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    # Holds the CARGO_REGISTRY_TOKEN secret. Add required reviewers to this
    # environment to approve each release before it uploads.
    environment: crates-io
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      # Skip crates already on crates.io at this version, so a rerun finishes a
      # release that stopped halfway; `cargo publish` refuses to republish.
      - name: Publish unreleased crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          packages=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.publish != []) | [.name, .version] | @tsv')
          skip=()
          remaining=0
          while IFS=$'\t' read -r name version; do
            index="$RUNNER_TEMP/$name-index.json"
            status=$(curl --silent --show-error --output "$index" --write-out '%{http_code}' \
              "https://index.crates.io/${name:0:2}/${name:2:2}/$name")
            case "$status" in
              200)
                published=$(jq --slurp --arg version "$version" \
                  'any(.[]; .vers == $version)' "$index")
                if [ "$published" = true ]; then
                  skip+=(--exclude "$name")
                  continue
                fi
                ;;
              404) ;;
              *)
                echo "::error::Registry lookup for $name failed with HTTP $status"
                exit 1
                ;;
            esac
            remaining=$((remaining + 1))
          done <<< "$packages"
          if [ "$remaining" -eq 0 ]; then
            echo "Every workspace crate version is already published."
          else
            cargo publish --workspace --locked "${skip[@]}"
          fi
