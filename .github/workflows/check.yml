name: Check
on: [push, pull_request, workflow_call]

permissions:
  contents: read

jobs:
  check:
    # The kernels test the native backend beside the scalar one: NEON `sdot` on
    # macOS (Apple silicon), scalar on Linux (x86-64).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just check
