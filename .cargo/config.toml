# The kernels select their SIMD path at compile time: SIMD128 (and relaxed SIMD when enabled) in
# wasm32, NEON `sdot` with the host CPU's features on aarch64. getrandom, which the tokenizer
# uses to seed hash maps, takes its backend from the runtime crate that links it, so runtimes
# import no entropy source; consumers set the same cfg.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "--cfg", 'getrandom_backend="custom"']

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
