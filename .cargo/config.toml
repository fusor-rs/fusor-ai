# The kernels select their SIMD path at compile time: SIMD128 (and relaxed SIMD when enabled) in
# wasm32, NEON `sdot` with the host CPU's features on aarch64. Consumers set the same flags.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]
