[package]
name = "fusor-ai-parakeet"
description = "Moondream's Parakeet Redux speech to text (parakeet-tdt-0.6b-v3 with ternary encoder weights): the log-mel frontend, the FastConformer encoder, the speech head, the TDT decoder, the pause segmenter and live transcription. No I/O; builds for native and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
keywords = ["fusor", "asr", "speech", "wasm", "inference"]
categories = ["multimedia::audio", "science", "wasm"]

[lib]
name = "parakeet"

[dependencies]
team.workspace = true
kernels.workspace = true
blocks.workspace = true
bundle.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
realfft.workspace = true

[features]
# Run the thread team on Rayon's pool (native, and the threaded browser runtimes).
threads = ["team/threads"]

[lints]
workspace = true
