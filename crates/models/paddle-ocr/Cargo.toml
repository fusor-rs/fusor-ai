[package]
name = "fusor-ai-paddle-ocr"
description = "PaddlePaddle's PaddleOCR-VL-1.6 document reader: image preprocessing, the NaViT vision encoder and projector, the ERNIE 4.5 language model with multimodal RoPE, prompts and greedy reading. No I/O; builds for native and wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../../README.md"
keywords = ["fusor", "ocr", "vision", "wasm", "inference"]
categories = ["computer-vision", "science", "wasm"]

[lib]
name = "paddle_ocr"

[dependencies]
team.workspace = true
kernels.workspace = true
blocks.workspace = true
bundle = { workspace = true, features = ["tokenizer"] }
serde.workspace = true

[features]
# Run the thread team on Rayon's pool (native, and the threaded browser runtimes).
threads = ["team/threads"]

[lints]
workspace = true
