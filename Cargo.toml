[workspace]
members = [
    "crates/team",
    "crates/kernels",
    "crates/blocks",
    "crates/bundle",
    "crates/compile",
    "crates/models/ming",
    "crates/models/ming-compile",
    "crates/models/phonon",
    "crates/models/phonon-compile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/fusor-rs/fusor-ai"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
team = { package = "fusor-ai-team", path = "crates/team", version = "=0.1.0" }
kernels = { package = "fusor-ai-kernels", path = "crates/kernels", version = "=0.1.0" }
blocks = { package = "fusor-ai-blocks", path = "crates/blocks", version = "=0.1.0" }
bundle = { package = "fusor-ai-bundle", path = "crates/bundle", version = "=0.1.0" }
compile = { package = "fusor-ai-compile", path = "crates/compile", version = "=0.1.0" }
ming = { package = "fusor-ai-ming", path = "crates/models/ming", version = "=0.1.0" }
ming-compile = { package = "fusor-ai-ming-compile", path = "crates/models/ming-compile", version = "=0.1.0" }
phonon = { package = "fusor-ai-phonon", path = "crates/models/phonon", version = "=0.1.0" }
phonon-compile = { package = "fusor-ai-phonon-compile", path = "crates/models/phonon-compile", version = "=0.1.0" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.2", default-features = false, features = ["unstable_wasm"] }
realfft = "=3.5.0"
regex = "=1.13.1"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
# tokenizers and the kernels are unusably slow unoptimised; optimise them even in dev builds.
opt-level = 3
debug = false

[profile.release]
debug = false
