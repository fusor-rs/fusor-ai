[workspace]
members = [
    "crates/team",
    "crates/kernels",
    "crates/media",
    "crates/blocks",
    "crates/bundle",
    "crates/compile",
    "crates/runtime",
    "crates/harness",
    "models/ming/model",
    "models/ming/compile",
    "models/ming/runtime",
    "models/ming/cli",
    "models/phonon/model",
    "models/phonon/compile",
    "models/phonon/runtime",
    "models/phonon/cli",
    "models/parakeet/model",
    "models/parakeet/compile",
    "models/parakeet/runtime",
    "models/parakeet/cli",
    "models/realistic-vision/model",
    "models/realistic-vision/compile",
    "models/realistic-vision/runtime",
    "models/realistic-vision/cli",
    "models/paddle-ocr/model",
    "models/paddle-ocr/compile",
    "models/paddle-ocr/runtime",
    "models/paddle-ocr/cli",
    "models/oxr/model",
    "models/oxr/compile",
    "models/oxr/runtime",
    "models/oxr/cli",
    "models/intern-decision/model",
    "models/intern-decision/compile",
    "models/intern-decision/runtime",
    "models/intern-decision/cli",
    "models/indra-ocr/model",
    "models/indra-ocr/compile",
    "models/indra-ocr/runtime",
    "models/indra-ocr/cli",
    "models/kronos/model",
    "models/kronos/compile",
    "models/kronos/runtime",
    "models/kronos/cli",
    "models/d3/model",
    "models/d3/compile",
    "models/d3/runtime",
    "models/d3/cli",
    "models/qwen3-5/model",
    "models/qwen3-5/compile",
    "models/qwen3-5/runtime",
    "models/qwen3-5/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/fusor-rs/fusor-ai"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
team = { package = "fusor-ai-team", path = "crates/team", version = "=0.1.2" }
kernels = { package = "fusor-ai-kernels", path = "crates/kernels", version = "=0.1.2" }
media = { package = "fusor-ai-media", path = "crates/media", version = "=0.1.2" }
blocks = { package = "fusor-ai-blocks", path = "crates/blocks", version = "=0.1.2" }
bundle = { package = "fusor-ai-bundle", path = "crates/bundle", version = "=0.1.2" }
compile = { package = "fusor-ai-compile", path = "crates/compile", version = "=0.1.2" }
runtime = { package = "fusor-ai-runtime", path = "crates/runtime", version = "=0.1.2" }
harness = { package = "fusor-ai-harness", path = "crates/harness", version = "=0.1.2" }
ming = { package = "fusor-ai-ming", path = "models/ming/model", version = "=0.1.2" }
ming-compile = { package = "fusor-ai-ming-compile", path = "models/ming/compile", version = "=0.1.2" }
phonon = { package = "fusor-ai-phonon", path = "models/phonon/model", version = "=0.1.2" }
phonon-compile = { package = "fusor-ai-phonon-compile", path = "models/phonon/compile", version = "=0.1.2" }
parakeet = { package = "fusor-ai-parakeet", path = "models/parakeet/model", version = "=0.1.2" }
parakeet-compile = { package = "fusor-ai-parakeet-compile", path = "models/parakeet/compile", version = "=0.1.2" }
realistic-vision = { package = "fusor-ai-realistic-vision", path = "models/realistic-vision/model", version = "=0.1.2" }
realistic-vision-compile = { package = "fusor-ai-realistic-vision-compile", path = "models/realistic-vision/compile", version = "=0.1.2" }
paddle-ocr = { package = "fusor-ai-paddle-ocr", path = "models/paddle-ocr/model", version = "=0.1.2" }
paddle-ocr-compile = { package = "fusor-ai-paddle-ocr-compile", path = "models/paddle-ocr/compile", version = "=0.1.2" }
oxr = { package = "fusor-ai-oxr", path = "models/oxr/model", version = "=0.1.2" }
oxr-compile = { package = "fusor-ai-oxr-compile", path = "models/oxr/compile", version = "=0.1.2" }
intern-decision = { package = "fusor-ai-intern-decision", path = "models/intern-decision/model", version = "=0.1.2" }
intern-decision-compile = { package = "fusor-ai-intern-decision-compile", path = "models/intern-decision/compile", version = "=0.1.2" }
indra-ocr = { package = "fusor-ai-indra-ocr", path = "models/indra-ocr/model", version = "=0.1.2" }
indra-ocr-compile = { package = "fusor-ai-indra-ocr-compile", path = "models/indra-ocr/compile", version = "=0.1.2" }
kronos = { package = "fusor-ai-kronos", path = "models/kronos/model", version = "=0.1.2" }
kronos-compile = { package = "fusor-ai-kronos-compile", path = "models/kronos/compile", version = "=0.1.2" }
d3 = { package = "fusor-ai-d3", path = "models/d3/model", version = "=0.1.2" }
d3-compile = { package = "fusor-ai-d3-compile", path = "models/d3/compile", version = "=0.1.2" }
qwen3-5 = { package = "fusor-ai-qwen3-5", path = "models/qwen3-5/model", version = "=0.1.2" }
qwen3-5-compile = { package = "fusor-ai-qwen3-5-compile", path = "models/qwen3-5/compile", version = "=0.1.2" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.2", default-features = false, features = ["unstable_wasm"] }
realfft = "=3.5.0"
miniz_oxide = "=0.8.9"
regex = "=1.13.1"
unicode-bidi = "=0.3.18"
unicode-normalization = "=0.1.25"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"] }
getrandom = "=0.3.4"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
png = "=0.18.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
# Dependencies such as tokenizers are unusably slow unoptimised; optimise them even in dev builds
# ("*" is every dependency, not the workspace's own crates).
opt-level = 3
debug = false

[profile.release]
debug = false

# Browser runtimes (scripts/build-runtime.sh): speed, fat LTO for size, abort on panic.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
