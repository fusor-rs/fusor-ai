[workspace]
members = [
    "crates/team",
    "crates/kernels",
    "crates/nn",
    "crates/bundle",
    "crates/compile",
    "crates/models/ming",
    "crates/models/ming-compile",
    "crates/hosts/ming-runtime",
    "crates/hosts/ming-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/fusor-rs/fusor-ai"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
team = { path = "crates/team", version = "=0.1.0" }
kernels = { path = "crates/kernels", version = "=0.1.0" }
nn = { path = "crates/nn", version = "=0.1.0" }
bundle = { path = "crates/bundle", version = "=0.1.0" }
compile = { path = "crates/compile", version = "=0.1.0" }
ming = { path = "crates/models/ming", version = "=0.1.0" }
ming-compile = { path = "crates/models/ming-compile", version = "=0.1.0" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
tokenizers = { version = "=0.22.2", default-features = false, features = ["unstable_wasm"] }
realfft = "=3.5.0"
regex = "=1.13.1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"] }
getrandom = "=0.3.4"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
# tokenizers and the kernels are unusably slow unoptimised; optimise them even in dev builds.
opt-level = 3
debug = false

[profile.release]
debug = false

# Browser runtimes (scripts/build-runtime.sh): speed, fat LTO for size, abort on panic.
[profile.wasm]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
