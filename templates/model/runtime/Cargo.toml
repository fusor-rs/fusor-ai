[package]
name = "__name__-runtime"
description = "The __name__ browser runtime: the model behind a wasm-bindgen surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
__name__.workspace = true
runtime.workspace = true

[features]
# Threaded runtimes (scripts/build-runtime.sh): the team runs on a wasm-bindgen-rayon pool of
# page-owned workers sharing this module's memory.
threads = ["__name__/threads", "runtime/threads"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints]
workspace = true
